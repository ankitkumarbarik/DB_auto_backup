name: MongoDB Backup

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # ✅ latest version

      - name: Setup Node.js
        uses: actions/setup-node@v4  # ✅ updated version
        with:
          node-version: "18"

      - name: Install MongoDB Tools
        run: sudo apt-get install -y mongodb-clients

      - name: Run backup script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          rm -rf backups
          mkdir -p backups
          mongodump --uri="$MONGO_URI" --out="backups/latest"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4  # ✅ updated version
        with:
          name: mongodb-latest-backup
          path: backups/latest/
